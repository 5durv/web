<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحميل فيديوهات من مواقع التواصل الاجتماعي</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <style>
        :root {
            --primary-color: #4361ee;
            --secondary-color: #3f37c9;
            --accent-color: #f72585;
            --light-color: #f8f9fa;
            --dark-color: #212529;
            --success-color: #4cc9f0;
            --warning-color: #f8961e;
            --danger-color: #f94144;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f5f5f5;
            color: var(--dark-color);
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .logo {
            width: 150px;
            margin-bottom: 20px;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: var(--primary-color);
        }
        
        .subtitle {
            font-size: 1.2rem;
            color: var(--secondary-color);
            margin-bottom: 20px;
        }
        
        .platforms {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .platform-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            border-radius: 10px;
            background-color: white;
            border: 2px solid #e0e0e0;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100px;
        }
        
        .platform-btn i {
            font-size: 24px;
            margin-bottom: 10px;
        }
        
        .platform-btn.active {
            border-color: var(--primary-color);
            background-color: var(--primary-color);
            color: white;
        }
        
        .platform-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .input-group {
            display: flex;
            margin-bottom: 30px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            border-radius: 10px;
            overflow: hidden;
        }
        
        #video-url {
            flex: 1;
            padding: 15px;
            border: none;
            font-size: 16px;
            font-family: 'Tajawal', sans-serif;
        }
        
        #download-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 15px 30px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background-color 0.3s ease;
            font-family: 'Tajawal', sans-serif;
        }
        
        #download-btn:hover {
            background-color: var(--secondary-color);
        }
        
        #download-btn:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        
        #result-container {
            display: none;
            background-color: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            margin-bottom: 40px;
        }
        
        .result-header {
            background-color: var(--primary-color);
            color: white;
            padding: 15px;
            text-align: center;
        }
        
        .result-content {
            padding: 20px;
        }
        
        .video-container {
            height: 400px;
            background-color: #f0f0f0;
            margin-bottom: 20px;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }
        
        .watermark-overlay {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 14px;
        }
        
        #download-options {
            background-color: #f9f9f9;
            padding: 20px;
            border-radius: 10px;
        }
        
        .options-title {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: var(--primary-color);
        }
        
        .option-group {
            margin-bottom: 20px;
        }
        
        .option-label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
        }
        
        .quality-options, .format-options {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .quality-btn, .format-btn {
            padding: 10px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            background-color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Tajawal', sans-serif;
        }
        
        .quality-btn.active, .format-btn.active {
            border-color: var(--primary-color);
            background-color: var(--primary-color);
            color: white;
        }
        
        .checkbox-option {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .checkbox-option input {
            margin-left: 10px;
        }
        
        #final-download-btn {
            display: block;
            width: 100%;
            padding: 15px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: 20px;
            font-family: 'Tajawal', sans-serif;
        }
        
        #final-download-btn:hover {
            background-color: #e5007d;
        }
        
        #final-download-btn:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        
        footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        }
        
        .footer-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
        
        .footer-links a {
            color: var(--primary-color);
            text-decoration: none;
            transition: color 0.3s ease;
        }
        
        .footer-links a:hover {
            color: var(--accent-color);
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .platform-btn {
                width: 80px;
                padding: 10px;
            }
            
            .input-group {
                flex-direction: column;
            }
            
            #download-btn {
                padding: 12px;
            }
            
            .video-container {
                height: 250px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <img src="logo.png" alt="شعار الموقع" class="logo">
            <h1>تحميل فيديوهات من مواقع التواصل الاجتماعي</h1>
            <p class="subtitle">قم بتحميل فيديوهات من تيك توك، يوتيوب، انستغرام، وتويتر بسهولة وبدون علامة مائية</p>
        </header>
        
        <div class="platforms">
            <div class="platform-btn active" data-platform="tiktok">
                <i class="fab fa-tiktok"></i>
                <span>تيك توك</span>
            </div>
            <div class="platform-btn" data-platform="youtube">
                <i class="fab fa-youtube"></i>
                <span>يوتيوب</span>
            </div>
            <div class="platform-btn" data-platform="instagram">
                <i class="fab fa-instagram"></i>
                <span>انستغرام</span>
            </div>
            <div class="platform-btn" data-platform="twitter">
                <i class="fab fa-twitter"></i>
                <span>تويتر (X)</span>
            </div>
        </div>
        
        <div class="input-group">
            <input type="text" id="video-url" placeholder="ضع رابط فيديو تيك توك هنا...">
            <button id="download-btn">تحميل <i class="fas fa-download"></i></button>
        </div>
        
        <div id="result-container">
            <div class="result-header">
                <h2>نتيجة التحميل</h2>
            </div>
            <div class="result-content">
                <div id="video-preview" class="video-container"></div>
                
                <div id="download-options">
                    <h3 class="options-title">خيارات التحميل</h3>
                    
                    <div class="option-group">
                        <label class="option-label">جودة الفيديو:</label>
                        <div class="quality-options">
                            <button class="quality-btn" data-quality="high">عالية</button>
                            <button class="quality-btn" data-quality="medium">متوسطة</button>
                            <button class="quality-btn" data-quality="low">منخفضة</button>
                        </div>
                    </div>
                    
                    <div class="option-group">
                        <label class="option-label">صيغة الملف:</label>
                        <div class="format-options">
                            <button class="format-btn" data-format="mp4">MP4</button>
                            <button class="format-btn" data-format="mp3">MP3 (صوت فقط)</button>
                        </div>
                    </div>
                    
                    <div class="option-group">
                        <label class="option-label">خيارات إضافية:</label>
                        <div class="checkbox-option">
                            <input type="checkbox" id="play-option" checked>
                            <label for="play-option">تشغيل الفيديو في المعاينة</label>
                        </div>
                        <div class="checkbox-option">
                            <input type="checkbox" id="watermark-option">
                            <label for="watermark-option">إضافة علامة مائية (@cvry)</label>
                        </div>
                    </div>
                    
                    <button id="final-download-btn">تحميل الآن <i class="fas fa-download"></i></button>
                </div>
            </div>
        </div>
        
        <footer>
            <p>جميع الحقوق محفوظة &copy; 2023</p>
            <div class="footer-links">
                <a href="#">سياسة الخصوصية</a>
                <a href="#">شروط الاستخدام</a>
                <a href="#">اتصل بنا</a>
            </div>
        </footer>
    </div>
    
    <!-- Custom JavaScript -->
    <script src="script.js"></script>
</body>
</html>
